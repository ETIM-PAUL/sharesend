# Render Blueprint for ShareSend: the agent service (Docker), the web app (Next.js) and Postgres.
# Create it in the Render dashboard: New > Blueprint > pick this repo. Steps and the Railway migration are in docs/deploy-render.md.
#
# Secrets and per-environment settings use `sync: false`: Render asks for them once when the Blueprint is created and never
# stores them in this file or overwrites them on later syncs. Values written below are defaults that a sync resets.
#
# Everything is in Singapore on purpose: Binance's APIs refuse some regions, and the agent must run outside them
# (the agent reports the region it runs in at /health). A region can't be changed after creation.

databases:
  - name: sharesend-db
    plan: 0.1c-256mb
    region: singapore
    postgresMajorVersion: "16"
    databaseName: sharesend
    user: sharesend

services:
  # The agent: API, the eight autonomous jobs, and the `baw` CLI for buying stock.
  - type: web
    name: sharesend-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    # Needs a paid plan: it must stay on for the jobs, and only paid services can have a disk.
    plan: 0.5c-512mb
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /health
    # The Agentic Wallet session lives here, so a redeploy doesn't sign it out. (A disk also means a redeploy
    # stops the old instance before starting the new one, so the API is briefly unavailable.)
    disk:
      name: baw
      mountPath: /root/.baw
      sizeGB: 1
    envVars:
      - key: PORT
        value: "8080"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sharesend-db
          property: connectionString
      # Start the buy as soon as a payment settles. Needs `baw` signed in (see docs/deploy-render.md).
      - key: AUTO_EXECUTE
        value: "true"
      - key: JOBS
        value: "on"
      - key: B402_NETWORK
        value: eip155:56
      - key: BINANCE_BASE_URL
        value: https://web3.binance.com/build
      - key: BSC_RPC_URL
        value: https://bsc-dataseed.bnbchain.org
      - key: MAX_GIFT_USD
        value: "20"
      - key: DAILY_CAP_USD
        value: "50"
      - key: SERVICE_FEE_USD
        value: "0.10"
      # Bearer token for /admin (Agentic Wallet sign-in, run a job). Render makes one; read it in the dashboard.
      - key: ADMIN_TOKEN
        generateValue: true
      # --- Set these when you create the Blueprint ---
      # "true" moves real money; leave "false" until everything below is checked.
      - key: LIVE_TRADING
        sync: false
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: VAULT_ADDRESS
        sync: false
      - key: VAULT_PRIVATE_KEY
        sync: false
      - key: AGENTIC_WALLET_ADDRESS
        sync: false
      # Constant key for the `baw` session (`openssl rand -hex 16`, never change it). Without it every deploy signs the wallet out.
      - key: BINANCE_INSTANCE_ID
        sync: false
      - key: IDENTITY_PRIVATE_KEY
        sync: false
      - key: IDENTITY_ADDRESS
        sync: false
      - key: ERC8004_AGENT_ID
        sync: false
      - key: ERC8004_REGISTER_TX
        sync: false
      # This service's public URL, e.g. https://sharesend-agent.onrender.com (published in the agent's on-chain profile).
      - key: AGENT_PUBLIC_URL
        sync: false
      # The web app's public URL: used in claim links.
      - key: CLAIM_BASE_URL
        sync: false
      # Browser origins allowed to call the agent: the web app's URL.
      - key: WEB_ORIGINS
        sync: false

  # The web app (Next.js).
  - type: web
    name: sharesend-web
    runtime: node
    rootDir: web
    region: singapore
    plan: 0.5c-512mb
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Both are read at build time and baked into the page, so changing either needs a redeploy.
      - key: NEXT_PUBLIC_AGENT_URL
        sync: false
      - key: NEXT_PUBLIC_PRIVY_APP_ID
        sync: false
